<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV browser presentation prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#eee);font-family:system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.preview{--bg:#151719;--surface:#25282b;--ink:#f3efe7;--quiet:#bbb9b3;--accent:#c7d8af;color:var(--ink);background:radial-gradient(at 20% 0%,#29322d,var(--bg) 65%);border-radius:16px;padding:32px;min-height:410px;position:relative;margin:16px 0}.preview.amber{--bg:#201b18;--surface:#342c25;--ink:#fff4e5;--quiet:#c9b8a6;--accent:#edc58c;background:linear-gradient(145deg,#352e26,var(--bg) 55%)}.switch{display:flex;gap:8px;flex-wrap:wrap}.switch button{border:0;background:var(--secondary,#27282b);color:inherit;padding:10px 16px;border-radius:8px}.switch button[aria-pressed=true]{background:var(--primary,#e5e6e8);color:var(--primary-foreground,#171819)}.eyebrow{color:var(--quiet);font-size:12px;letter-spacing:.09em;text-transform:uppercase}.top{display:flex;justify-content:space-between;gap:16px;margin-bottom:24px}h1{font-size:clamp(26px,4vw,38px);font-weight:550;letter-spacing:-.04em;margin:0 0 8px}h2{font-size:18px;font-weight:550;margin:24px 0 12px}p{color:var(--quiet);font-size:14px;line-height:1.6}.preview button{border:2px solid transparent;color:var(--ink);background:var(--surface);border-radius:12px;min-height:48px;padding:12px 16px;text-align:left;transition:background .12s,transform .12s}.preview button:focus,.preview button.focus{background:var(--accent);color:var(--bg);outline:2px solid var(--ink);outline-offset:3px;transform:scale(1.015)}.preview button.quiet{background:transparent}.preview button.quiet:focus,.preview button.quiet.focus{background:var(--accent)}.preview button:disabled{opacity:.45;cursor:default}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.row{display:flex;gap:12px;flex-wrap:wrap}.address{width:100%;font-size:20px;display:flex;justify-content:space-between;align-items:center;margin:26px 0}.small{font-size:12px;color:var(--quiet)}.card{min-height:86px;display:flex;flex-direction:column;justify-content:center;gap:8px;overflow-wrap:anywhere}.card .small{color:inherit;opacity:.72}.footer{margin-top:30px;display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--quiet)}.page{height:230px;background:#f6f1e8;color:#25221d;border-radius:8px;padding:26px;margin-bottom:18px}.page p{color:#655c50}.bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:center;background:var(--bg);padding:16px;border-radius:12px}.bar>.small{grid-column:1/-1}.bar button{min-height:44px;padding:8px 12px}.list{display:grid;gap:10px}.list button{display:flex;justify-content:space-between;gap:20px}.editor{width:100%;border:2px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:12px;padding:16px;margin:18px 0}.meta{font-size:12px;color:var(--muted-foreground,#aaa);margin:12px 0}.notice{border-left:3px solid var(--accent);padding:0 16px;color:var(--quiet);font-size:14px}@media(max-width:520px){.preview{padding:24px}.grid{grid-template-columns:1fr 1fr}.top{flex-direction:column}.footer{flex-direction:column}}@media(prefers-reduced-motion:reduce){.preview button{transition:none;transform:none!important}}
</style>
<div class="switch" aria-label="Visual alternatives"><button id="sage" aria-pressed="true">Charcoal · sage</button><button id="amber" aria-pressed="false">Warm cinema · amber</button></div>
<p class="meta">Design prototype · synthetic normal browsing data · D-pad arrows, Enter and Escape/Back. Native security and IME remain owned by Chromium/Android in the APK.</p>
<main class="preview" id="screen" aria-live="polite"></main>
<div class="meta" id="state"></div>
<script>
let variant='sage',route='home',focus=0,fullscreen=false,tabs=['A quiet place to start','NASA — Our changing planet and the discoveries that help us understand it','Wikipedia — The free encyclopedia'],selected=0,empty=false,editing=false;
const screen=document.querySelector('#screen');
const savedFocus={};
const parents={};
const button=(label,act,extra='')=>`<button data-act="${act}" ${extra}>${label}</button>`;
function move(next,restore=false){
savedFocus[route]=focus;
if(!restore)parents[next]=route;route=next;focus=0;editing=false;draw();
if(restore&&savedFocus[route]!==undefined)focusItem(savedFocus[route]);
else if(route==='controls')focusItem([...screen.querySelectorAll('button')].findIndex(x=>x.dataset.act==='address'));
}
function focusItem(index){const b=[...screen.querySelectorAll('button:not(:disabled),input')];focus=Math.max(0,Math.min(index,b.length-1));screen.querySelectorAll('.focus').forEach(x=>x.classList.remove('focus'));b[focus]?.classList.add('focus');b[focus]?.focus()}
function directionalFocus(key){
const items=[...screen.querySelectorAll('button:not(:disabled),input')],current=items[focus];
if(!current)return;
if(route==='home'&&focus===0&&key==='ArrowDown'){focusItem(1);return}
const horizontal=key==='ArrowLeft'||key==='ArrowRight',sign=key==='ArrowLeft'||key==='ArrowUp'?-1:1;
const from=current.getBoundingClientRect(),center=r=>horizontal?(r.left+r.right)/2:(r.top+r.bottom)/2;
const cross=r=>horizontal?(r.top+r.bottom)/2:(r.left+r.right)/2;
const candidates=items.map((item,index)=>({index,rect:item.getBoundingClientRect()}))
.filter(x=>x.index!==focus&&(horizontal?(sign>0?x.rect.left>=from.right-1:x.rect.right<=from.left+1):(sign>0?x.rect.top>=from.bottom-1:x.rect.bottom<=from.top+1)))
.map(x=>({...x,beam:horizontal?x.rect.bottom>from.top&&x.rect.top<from.bottom:x.rect.right>from.left&&x.rect.left<from.right,
score:13*(center(x.rect)-center(from))**2+(cross(x.rect)-cross(from))**2}));
candidates.sort((a,b)=>Number(b.beam)-Number(a.beam)||a.score-b.score);
if(candidates.length)focusItem(candidates[0].index);
}
function draw(){screen.className='preview '+(variant==='amber'?'amber':'');let content='';
if(route==='home')content=`<div class="top"><span class="eyebrow">Your browser</span><span class="small">Normal browsing · 3 tabs</span></div><h1>The web. On your terms.</h1><p>Simple, private, and ad-blocking.</p>${button('Address or search <span>↗</span>','address','class="address"')}<div class="row">${button('Browser controls','controls','class="quiet"')}${button('Tabs','tabs','class="quiet"')}${button('Bookmarks','library','class="quiet"')}${button('Settings','settings','class="quiet"')}</div><h2>Favorites</h2><div class="grid">${button('Wikipedia <span class="small">wikipedia.org</span>','page','class="card"')}${button('NASA <span class="small">nasa.gov</span>','page','class="card"')}${button('Add a favorite <span class="small">Save a page from browser controls</span>','library','class="card"')}</div><h2>Continue browsing</h2>${button(tabs[1]||'Your recent normal tabs appear here','page','class="card"')}<div class="footer"><span>An independent open-source fork of Brave, built on Chromium.</span></div><div class="row">${button('Use your phone','phone','class="quiet"')}${button('Source','about','class="quiet"')}${button('Licenses','about','class="quiet"')}</div>`;
if(route==='address')content=`<span class="eyebrow">Address or search</span><h1>Where would you like to go?</h1><p>Search with your selected provider, or enter a full web address.</p><input class="editor" aria-label="Address or search" value="https://www.nasa.gov"><div class="row">${button('Go','page')}${button('Clear','clear')}${button('Cancel','back')}</div><h2>Suggestions</h2><div class="list">${button('NASA <span class="small">https://www.nasa.gov</span>','page')}${button('Search for “space exploration”','page')}</div>`;
if(route==='page'||route==='controls')content=`<div class="page"><span class="eyebrow" style="color:#655c50">Website content dominates</span><h1>Explore the universe.</h1><p>A real Chromium page stays attached below the browser presentation.</p>${button(fullscreen?'Exit fullscreen':'Play in fullscreen','fullscreen')}</div>${route==='controls'?`<div class="bar"><span class="small">https://www.nasa.gov · Connection details</span>${button('Address','address')}${button('← Back','backpage')}${button('Forward','page','disabled')}${button('Reload','page')}${button('Tabs','tabs')}${button('Protection','settings')}${button('Library','library')}${button('Settings','settings')}${button('Return to page','page')}</div>`:`<p class="small">Back ${fullscreen?'exits fullscreen':'opens browser controls'} · D-pad moves the page pointer · OK selects</p>`}`;
if(route==='tabs')content=`<div class="top"><h1>Tabs</h1><span class="small">Normal browsing</span></div><div class="row">${button('New tab','new')}${button('Private tabs','private')}${button('Back','back')}</div><h2>${tabs.length?'Choose a tab':'No tabs'}</h2><div class="grid">${tabs.map((t,i)=>button(`${i===selected?'Current · ':''}${t}<span class="small">${i===0?'Home':'Saved page · Chromium tab model'}</span>`,`select:${i}`,'class="card"')).join('')}</div><div class="row" style="margin-top:20px">${button('Close current tab','close')}${button('Close final tab recovery demo','final')}</div>`;
if(route==='library')content=`<h1>Library</h1><p>Your saved pages and browsing history.</p><div class="row">${button('Favorites','favorites')}${button('History','history')}${button('Downloads','downloads')}${button('Back','back')}</div><h2>${empty?'Nothing saved yet':'Favorites'}</h2>${empty?'<p>Save a page from browser controls. Your favorites will appear here.</p>':`<div class="list">${button('Wikipedia <span class="small">wikipedia.org</span>','page')}${button('NASA <span class="small">nasa.gov</span>','page')}</div>`}${button('Preview empty state','empty')}`;
if(route==='settings')content=`<h1>Settings</h1><p>Focused controls for everyday browsing.</p><div class="list">${button('Search provider <span class="small">Google</span>','provider')}${button('Privacy and browser data','privacy')}${button('Site protection and filters','protection')}${button('About, source and licenses','about')}${button('Back','back')}</div>`;
if(route==='phone')content=`<h1>Use your phone</h1><p class="notice">Development experiment. This local HTTP connection is unencrypted. Approve only a phone you trust on your own network.</p><h2>Waiting for TV approval</h2><p>The invitation was accepted. Use the TV remote to approve or reject the connection.</p><div class="row">${button('Reject','home')}${button('Approve this phone','connected')}</div>`;
if(route==='private')content=`<h1>Private tabs</h1><p>No normal favorites, recent titles or phone controls are copied here.</p><div class="row">${button('New private tab','privatehome')}${button('Normal tabs','tabs')}</div>`;
if(route==='privatehome')content=`<h1>Private browsing</h1><p>Private history stays out of your normal browsing session.</p>${button('Address or search','address','class="address"')}${button('End private session','home')}`;
if(['history','downloads','provider','privacy','protection','about','connected'].includes(route))content=`<h1>${({history:'History',downloads:'Downloads',provider:'Search provider',privacy:'Browser data',protection:'Site protection',about:'About this browser',connected:'Phone connected'})[route]}</h1><p>${route==='downloads'?'No downloads yet. Downloaded files remain owned by the native browser.':route==='privacy'?'Clear only the selected data. Bookmarks and downloads remain separate.':'Native browser models remain the source of truth.'}</p><div class="row">${route==='privacy'?button('Clear selected data','confirm'):''}${button('Back','back')}</div>`;
if(route==='confirm')content=`<h1>Clear selected data?</h1><p>Only the chosen normal-profile data will be removed. This prototype does not delete anything.</p><div class="row">${button('Cancel','back')}${button('Clear data','back')}</div>`;
screen.innerHTML=content;screen.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));focusItem(focus);document.querySelector('#state').textContent=`Prototype state: ${variant} · ${route} · ${tabs.length} normal tabs · fullscreen ${fullscreen} · ${route==='confirm'?'Cancel initially focused':'one input owner'}`;
}
function act(a){if(a.startsWith('select:')){selected=+a.split(':')[1];move('page');return}if(a==='fullscreen'){fullscreen=!fullscreen;move('page');return}if(a==='clear'){screen.querySelector('input').value='';editing=true;focusItem(0);return}if(a==='empty'){empty=!empty;draw();return}if(a==='favorites'){empty=false;draw();return}if(a==='new'){tabs.push('New tab');selected=tabs.length-1;move('home');return}if(a==='close'||a==='final'){if(a==='final')tabs=[];else tabs.splice(selected,1);selected=Math.max(0,Math.min(selected,tabs.length-1));if(!tabs.length){tabs=['A quiet place to start'];selected=0;move('home')}else draw();return}if(a==='backpage'){move('controls');return}if(a==='back'){back();return}move(a)}
function back(){if(fullscreen){fullscreen=false;move('page')}else if(route==='page')move('controls');else move(parents[route]||'home',true)}
document.addEventListener('keydown',e=>{const b=[...screen.querySelectorAll('button:not(:disabled),input')];if(e.key==='Escape'||e.key==='Backspace'&&!editing){e.preventDefault();if(editing){editing=false;focusItem(0);return}back();return}if(editing){if(e.key==='Enter'){e.preventDefault();editing=false;move('page')}else if(e.key==='ArrowDown'){e.preventDefault();editing=false;focusItem(1)}return}if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();directionalFocus(e.key)}if(e.key==='Enter'){e.preventDefault();if(b[focus]?.tagName==='INPUT'){editing=true;b[focus].focus()}else b[focus]?.click()}});
for(const v of ['sage','amber'])document.querySelector('#'+v).onclick=()=>{variant=v;document.querySelectorAll('.switch button').forEach(b=>b.setAttribute('aria-pressed',b.id===v));draw()};draw();
</script></html>
