<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>TV remote · Soft charcoal sketch</title>
<style>
* { box-sizing: border-box; }
:root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f6f1f6; background: #201d26; }
body { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid #cbb6e6; outline-offset: 4px; }
button:hover { filter: brightness(1.08); }
button:active { transform: translateY(1px); }
::selection { background: #cbb6e6; color: #201d26; }
.phone { width: min(100%, 390px); height: 844px; overflow: hidden; margin: 0 auto; padding: 20px 20px 22px; display: flex; flex-direction: column; background: #201d26; }
.connection { display: flex; align-items: center; justify-content: space-between; height: 44px; flex: none; }
.brand { display: flex; gap: 9px; align-items: center; font-weight: 650; font-size: 18px; letter-spacing: -.02em; }
.status { display: flex; gap: 7px; align-items: center; color: #d9cbe6; font-size: 12px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #cbb6e6; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.warning { display: flex; align-items: center; gap: 8px; margin-top: 12px; min-height: 34px; color: #f4cd87; font-size: 11px; font-weight: 550; }
.warning svg { width: 15px; height: 15px; }
.identity { margin: 22px 0 16px; }
h1 { font-size: 27px; line-height: 1.2; font-weight: 600; letter-spacing: -.025em; margin: 0 0 7px; }
.url { margin: 0; color: #c9becf; font-size: 13px; }
.touchpad { position: relative; display: flex; align-items: center; justify-content: center; height: 342px; flex: none; border-radius: 16px; background: #322d3d; color: #ded0ec; touch-action: none; }
.pad-label { position: absolute; top: 20px; left: 20px; margin: 0; font-size: 13px; font-weight: 550; }
.pointer { width: 32px; height: 32px; stroke-width: 1.5; color: #cbb6e6; }
.pad-guide { position: absolute; bottom: 21px; margin: 0; text-align: center; color: #d2c5df; font-size: 12px; line-height: 1.7; }
.quick { display: grid; grid-template-columns: 1fr 1fr 1fr 1.65fr; gap: 7px; margin-top: 12px; }
.quick button { height: 54px; padding: 0; border: 0; border-radius: 12px; background: #322d3d; display: flex; align-items: center; justify-content: center; }
.quick .click { gap: 9px; background: #cbb6e6; color: #201d26; font-size: 15px; font-weight: 650; }
.quick .click svg { width: 20px; height: 20px; }
.scroll { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.scroll-label { flex: 1; font-size: 13px; color: #d2c5df; }
.scroll button { display: flex; gap: 7px; align-items: center; justify-content: center; border: 1px solid #685d76; border-radius: 12px; background: transparent; height: 46px; padding: 0 15px; font-size: 13px; }
.scroll svg { width: 18px; height: 18px; }
.media-note { color: #c9becf; font-size: 11px; line-height: 1.5; margin: 13px 0 0; text-align: center; }
.nav { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: auto; height: 62px; flex: none; }
.nav button { display: flex; gap: 5px; flex-direction: column; justify-content: center; align-items: center; border: 0; border-radius: 12px; background: transparent; color: #c9becf; font-size: 11px; font-weight: 550; }
.nav .selected { color: #edddfc; background: #322d3d; }
.nav svg { width: 22px; height: 22px; }
@media (max-width: 360px) { .phone { padding-left: 16px; padding-right: 16px; } h1 { font-size: 25px; } .scroll button { padding: 0 11px; } }
@media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>
</head>
<body>
<main class="phone" aria-label="TV phone remote — illustrative preview">
  <header class="connection">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>TV remote</div>
    <div class="status"><span class="status-dot"></span>Connected</div>
  </header>
  <div class="warning" role="note">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5m0 3h.01"/></svg>
    Development experiment · Unencrypted
  </div>
  <section class="identity" aria-label="Current TV page">
    <h1>A quiet evening</h1>
    <p class="url">fixture.test</p>
  </section>
  <div class="touchpad" role="img" aria-label="Touchpad. Swipe to move the TV pointer. Tap to click. Two fingers to scroll.">
    <p class="pad-label">Touchpad</p>
    <svg class="pointer" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 5v21l6-6 5 9 4-2-5-9h9L9 5Z"/></svg>
    <p class="pad-guide">Swipe to move · Tap to click<br>Two fingers to scroll</p>
  </div>
  <div class="quick" aria-label="Quick browser controls">
    <button type="button" aria-label="Back" title="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 5-7 7 7 7M6 12h14"/></svg></button>
    <button type="button" aria-label="Forward" title="Forward"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 5 7 7-7 7M18 12H4"/></svg></button>
    <button type="button" aria-label="Reload" title="Reload"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10a8 8 0 1 0-1 7M20 4v6h-6"/></svg></button>
    <button type="button" class="click"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v16l5-5 4 7 3-2-4-6h7L6 3Z"/></svg>Click</button>
  </div>
  <div class="scroll" aria-label="Scroll alternatives">
    <span class="scroll-label">Scroll</span>
    <button type="button" aria-label="Scroll up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg>Up</button>
    <button type="button" aria-label="Scroll down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 10 6 6 6-6"/></svg>Down</button>
  </div>
  <p class="media-note">To play or pause, click the controls on the TV page.</p>
  <nav class="nav" aria-label="Remote tools">
    <button type="button" class="selected" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 6h4m-4 12h4m-2-2v4"/></svg>Remote</button>
    <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M10 13h.01M14 13h.01M18 13h.01M7 16h10"/></svg>Type</button>
    <button type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="14" height="15" rx="2"/><path d="M17 18v3H3V7h4"/></svg>Tabs</button>
  </nav>
</main>
</body>
</html>
